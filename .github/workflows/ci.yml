name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rewrite git ssh -> https (tk2k-message-assist依存対策)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: npm ci
      - run: npm test
      # vite.config.js のビルド時プラグイン（sample.zip生成など）は
      # vitest では実行されないため、build まで通してゲートにする
      - run: npm run build
